---
name: Publish PKGBUILD

permissions: {}

# Publishes a self-contained, version-pinned PKGBUILD (+ .SRCINFO + .install) to Cloudflare R2
# whenever a tag is pushed to this fork. The PKGBUILD is not built here - it's the AUR-style
# source itself, pinned via `_commit`/`pkgver` to the exact tag/commit it was generated from, so
# an external mirror (e.g. mtune-mirror) can fetch it from a stable URL and build it there.
#
# The same three files are also committed to the `pkgbuild` branch of this repository. A mirror
# that tracks a git ref (mtune-mirror's source=git) can then notice a new version by itself,
# because the branch moves whenever a tag is published, instead of someone pasting the PKGBUILD
# into the mirror by hand.
#
# Does not affect the normal CI pipeline (ci.yml and friends) in any way.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Tag to publish a PKGBUILD for. Leave blank when re-running a tag-push-triggered run;
          required when triggering manually.
        required: false
        type: string

jobs:
  publish:
    name: Publish PKGBUILD to R2
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
    permissions:
      contents: write  # pushes the generated files to the pkgbuild branch
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - name: Validate R2 configuration
        run: |
          if [ -z "${R2_BUCKET}" ] || [ -z "${R2_ENDPOINT}" ]; then
            echo "::error::vars.R2_BUCKET and vars.R2_ENDPOINT must be set in this repository's Actions settings (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - name: Resolve tag
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          tag="${INPUT_REF}"
          if [ -z "${tag}" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "${tag}" ] || [ "${tag}" == "${GITHUB_REF}" ]; then
            echo "::error::No tag resolved. Trigger via a tag push, or pass 'ref' explicitly via workflow_dispatch."
            exit 1
          fi
          echo "Publishing PKGBUILD for tag: ${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Update keyring
        run: |
          pacman -Syy --disable-download-timeout --needed --noconfirm archlinux-keyring
          pacman -Syu --disable-download-timeout --noconfirm
          pacman -Scc --noconfirm

      - name: Install dependencies
        run: |
          pacman -Syu --disable-download-timeout --needed --noconfirm \
            base-devel \
            cmake \
            git \
            aws-cli
          pacman -Scc --noconfirm

      - name: Setup builder user
        run: |
          # arch prevents running makepkg as root
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Fix workspace permissions
        run: chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Derive version
        id: version
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          # A tag shaped like upstream's release plus a fork suffix (v2026.1018.5342-extra1) maps to
          # pkgver 2026.1018.5342.extra1, which sorts above that upstream release and below the next
          # one. Any other tag falls back to upstream's calendar-versioning scheme (vYYYY.M{D}D.HHMMSS,
          # UTC, from the commit's committer date) so pkgver still reflects when the commit landed.
          # Workspace was just chown'd to builder above, so root (running this step) needs an
          # explicit safe.directory exception to run git commands here.
          if [[ "${TAG}" =~ ^v(20[0-9]{2}\.[0-9]+\.[0-9]+)-([A-Za-z0-9]+)$ ]]; then
            pkgver="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            pkgver="$(TZ=UTC git log -1 --date='format-local:%Y.%-m%d.%H%M%S' --format=%cd HEAD)"
          fi
          echo "Derived pkgver: ${pkgver}"
          echo "pkgver=${pkgver}" >> "${GITHUB_OUTPUT}"

      - name: Configure PKGBUILD
        env:
          BRANCH: ${{ steps.ref.outputs.tag }}
          BUILD_VERSION: ${{ steps.version.outputs.pkgver }}
          CLONE_URL: ${{ github.event.repository.clone_url }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p build
          cd build
          cmake \
            -DSUNSHINE_CONFIGURE_ONLY=ON \
            -DSUNSHINE_CONFIGURE_PKGBUILD=ON \
            -DSUNSHINE_SUB_VERSION="" \
            ..
          chmod -R a+rX "${GITHUB_WORKSPACE}/build"

      - name: Generate .SRCINFO
        run: |
          mkdir -p pkg
          cp build/PKGBUILD pkg/
          cp build/sunshine.install pkg/
          chown -R builder:builder pkg

          cd pkg
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          cat .SRCINFO

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          aws s3 cp pkg/PKGBUILD "s3://${R2_BUCKET}/aur/PKGBUILD" --endpoint-url "${R2_ENDPOINT}"
          aws s3 cp pkg/.SRCINFO "s3://${R2_BUCKET}/aur/.SRCINFO" --endpoint-url "${R2_ENDPOINT}"
          aws s3 cp pkg/sunshine.install "s3://${R2_BUCKET}/aur/sunshine.install" --endpoint-url "${R2_ENDPOINT}"

      - name: Publish to the pkgbuild branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          url="https://github.com/${REPOSITORY}.git"

          # A separate repository keeps this branch to just the three files, with no link to the
          # source history, so it can be cloned quickly and a mirror's checkout stays tiny.
          work="$(mktemp -d)"
          git init -q "${work}"
          cd "${work}"
          if git -c "http.https://github.com/.extraheader=${auth}" fetch -q --depth 1 "${url}" pkgbuild; then
            git checkout -q -B pkgbuild FETCH_HEAD
          else
            git checkout -q --orphan pkgbuild
          fi

          cp "${GITHUB_WORKSPACE}/pkg/PKGBUILD" "${GITHUB_WORKSPACE}/pkg/.SRCINFO" "${GITHUB_WORKSPACE}/pkg/sunshine.install" .
          git add PKGBUILD .SRCINFO sunshine.install
          if git diff --cached --quiet; then
            echo "pkgbuild branch already matches ${TAG}, nothing to commit"
            exit 0
          fi
          git commit -q -m "PKGBUILD for ${TAG}"
          git -c "http.https://github.com/.extraheader=${auth}" push -q "${url}" pkgbuild

      - name: Summary
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          echo "### Published PKGBUILD for \`${TAG}\` :package:" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Destination: \`s3://${R2_BUCKET}/aur/\` (overwritten in place)" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Files:" >> "${GITHUB_STEP_SUMMARY}"
          echo "- PKGBUILD" >> "${GITHUB_STEP_SUMMARY}"
          echo "- .SRCINFO" >> "${GITHUB_STEP_SUMMARY}"
          echo "- sunshine.install" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Also committed to the \`pkgbuild\` branch for git-tracking mirrors." >> "${GITHUB_STEP_SUMMARY}"
